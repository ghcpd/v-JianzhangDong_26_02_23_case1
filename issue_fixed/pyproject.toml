[project]
name = "smart-report-service"
version = "0.1.0"
description = "Smart Report Service for Dependency Upgrade Testing"
requires-python = ">=3.9"
readme = "README.md"
authors = [
    { name = "Test Author", email = "test@example.com" }
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "python-dateutil==2.9.0.post0",
    "structlog==24.4.0",
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
    "httpx==0.27.2",
    "anyio==4.6.2.post1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra -q"
testpaths = [
    "tests"
]
