[project]
name = "smart-report-service"
version = "0.1.0"
description = "Smart Report Service for Dependency Upgrade Testing"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Test Author", email = "test@example.com" }
]

dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "python-dateutil==2.9.0.post0",
    "structlog==24.1.0",
    "pyyaml==6.0.2",
    "jsonschema==4.22.0",
    "httpx==0.27.0",
    "anyio==4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra -q"
testpaths = [
    "tests"
]
